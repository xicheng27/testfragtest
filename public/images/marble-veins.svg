    <path d="M-60 720 C 320 600, 620 800, 920 670 S 1320 540, 1700 700" stroke-width="40" stroke-opacity="0.22"/>
    <path d="M330 -60 C 390 250, 250 520, 440 800 S 540 1070, 470 1160" stroke-width="32" stroke-opacity="0.20"/>
