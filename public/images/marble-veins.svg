    <path d="M-40 360 C 240 322, 446 470, 720 404" stroke-width="1" stroke-opacity="0.20"/>
    <path d="M-40 660 C 260 624, 470 740, 760 660" stroke-width="0.9" stroke-opacity="0.18"/>
    <path d="M900 -40 C 950 180, 880 360, 980 600" stroke-width="0.9" stroke-opacity="0.18"/>
