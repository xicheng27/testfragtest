<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="cloud" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f7f6f3"/>

  <!-- Grey marble clouds: heavier upper-left & centre, like the reference -->
  <g filter="url(#cloud)" fill="none" stroke-linecap="round" stroke="#a39d93">
    <path d="M-80 120 C 180 60, 360 220, 520 160 S 760 60, 900 170" stroke-width="42" stroke-opacity="0.22"/>
    <path d="M260 -80 C 320 180, 220 420, 360 660 S 430 900, 380 1080" stroke-width="34" stroke-opacity="0.20"/>
    <path d="M-80 760 C 200 700, 420 860, 700 780 S 1040 700, 1180 760" stroke-width="30" stroke-opacity="0.16"/>
    <path d="M820 120 C 980 80, 1180 200, 1420 150" stroke-width="26" stroke-opacity="0.12"/>
  </g>

  <!-- Grey crisp veining -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7d776c">
    <path d="M-40 130 C 200 185, 305 120, 470 225 S 760 300, 900 250" stroke-width="2.4" stroke-opacity="0.26"/>
    <path d="M210 -40 C 250 170, 185 330, 270 540 S 320 760, 280 920" stroke-width="2.2" stroke-opacity="0.24"/>
    <path d="M-40 770 C 210 720, 415 845, 705 785 S 1060 720, 1200 775" stroke-width="2" stroke-opacity="0.20"/>
    <path d="M120 250 C 180 320, 150 430, 230 520" stroke-width="1.3" stroke-opacity="0.18"/>
    <path d="M470 225 C 520 300, 470 380, 520 470" stroke-width="1.3" stroke-opacity="0.18"/>
    <path d="M900 250 C 1010 235, 1120 300, 1260 270" stroke-width="1.2" stroke-opacity="0.16"/>
  </g>

  <!-- Gold kintsugi network: central-left trunk fanning right, with offshoots -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft glow underlay -->
    <g filter="url(#soft)" stroke="#e7c878" stroke-opacity="0.5">
      <path d="M470 -40 C 522 130, 470 305, 545 485 S 605 705, 560 770" stroke-width="7"/>
      <path d="M500 165 C 705 150, 905 250, 1185 212 S 1505 262, 1680 232" stroke-width="6"/>
      <path d="M545 305 C 765 272, 985 332, 1265 302 S 1565 332, 1680 322" stroke-width="6"/>
      <path d="M522 120 C 722 92, 942 150, 1205 112 S 1525 152, 1680 122" stroke-width="5.5"/>
      <path d="M545 485 C 765 520, 985 560, 1185 520 S 1485 470, 1680 520" stroke-width="5.5"/>
    </g>
    <!-- gold "pools" at the main junctions -->
    <g fill="#c9a23a" fill-opacity="0.5">
      <path d="M492 150 C 516 138, 540 160, 533 188 C 526 214, 498 218, 484 200 C 472 182, 476 160, 492 150 Z"/>
      <path d="M528 300 C 552 290, 574 312, 566 338 C 558 362, 532 364, 520 346 C 510 330, 514 310, 528 300 Z"/>
    </g>
    <!-- crisp gold veins -->
    <g stroke="#c79a36" stroke-opacity="0.92">
      <path d="M470 -40 C 522 130, 470 305, 545 485 S 605 705, 560 770" stroke-width="3.2"/>
      <path d="M500 165 C 705 150, 905 250, 1185 212 S 1505 262, 1680 232" stroke-width="2.8"/>
      <path d="M545 305 C 765 272, 985 332, 1265 302 S 1565 332, 1680 322" stroke-width="2.6"/>
      <path d="M522 120 C 722 92, 942 150, 1205 112 S 1525 152, 1680 122" stroke-width="2.2"/>
      <path d="M545 485 C 765 520, 985 560, 1185 520 S 1485 470, 1680 520" stroke-width="2.4"/>
      <!-- offshoots -->
      <path d="M905 250 C 952 202, 1004 222, 1044 172" stroke-width="1.5"/>
      <path d="M1185 212 C 1232 250, 1284 230, 1324 272" stroke-width="1.5"/>
      <path d="M985 332 C 1024 384, 1086 362, 1124 414" stroke-width="1.4"/>
      <path d="M765 272 C 805 322, 765 364, 806 414" stroke-width="1.4"/>
      <path d="M985 560 C 1026 612, 1088 600, 1126 652" stroke-width="1.4"/>
      <path d="M545 485 C 505 540, 520 612, 470 660" stroke-width="1.5"/>
      <path d="M1205 112 C 1252 86, 1300 104, 1352 80" stroke-width="1.3"/>
    </g>
    <!-- bright highlight along the mains -->
    <g stroke="#f4dc94" stroke-opacity="0.85">
      <path d="M470 -40 C 522 130, 470 305, 545 485 S 605 705, 560 770" stroke-width="0.9"/>
      <path d="M500 165 C 705 150, 905 250, 1185 212 S 1505 262, 1680 232" stroke-width="0.8"/>
      <path d="M545 305 C 765 272, 985 332, 1265 302 S 1565 332, 1680 322" stroke-width="0.8"/>
      <path d="M545 485 C 765 520, 985 560, 1185 520 S 1485 470, 1680 520" stroke-width="0.8"/>
    </g>
  </g>
</svg>
