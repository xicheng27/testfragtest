      <path d="M-30 630 C 270 588, 480 705, 770 622 S 1190 532, 1700 642" stroke-width="2.6"/>
      <path d="M480 705 C 520 760, 480 816, 530 882" stroke-width="1.5"/>
      <path d="M1290 -30 C 1345 195, 1225 375, 1355 635" stroke-width="2.6"/>
