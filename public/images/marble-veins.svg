<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="cloud" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f8f7f4"/>

  <!-- Soft grey marble clouds -->
  <g filter="url(#cloud)" fill="none" stroke-linecap="round" stroke="#b6b1a6">
    <path d="M-60 240 C 260 160, 470 360, 760 270 S 1220 160, 1700 300" stroke-width="30" stroke-opacity="0.20"/>
    <path d="M-60 720 C 320 610, 620 780, 920 670 S 1320 560, 1700 700" stroke-width="34" stroke-opacity="0.18"/>
    <path d="M320 -60 C 380 250, 250 500, 430 780 S 540 1060, 470 1140" stroke-width="26" stroke-opacity="0.16"/>
  </g>

  <!-- Mid grey veining -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke="#8c867b">
    <path d="M-40 330 C 250 280, 430 430, 690 360 S 1110 250, 1680 360" stroke-width="6" stroke-opacity="0.16"/>
    <path d="M-40 362 C 260 320, 450 480, 710 410" stroke-width="3" stroke-opacity="0.13"/>
    <path d="M900 -40 C 960 220, 815 430, 975 700 S 1075 980, 1010 1080" stroke-width="5" stroke-opacity="0.15"/>
    <path d="M120 1060 C 330 800, 710 885, 985 600 S 1330 360, 1700 430" stroke-width="6" stroke-opacity="0.15"/>
    <path d="M1180 -40 C 1230 180, 1130 360, 1260 600" stroke-width="4" stroke-opacity="0.12"/>
  </g>

  <!-- Gold kintsugi veins: glow, crisp line, branches, highlight -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#soft)" stroke="#e7c878" stroke-opacity="0.40">
      <path d="M-30 300 C 240 248, 432 402, 690 338 S 1120 228, 1700 338" stroke-width="8"/>
      <path d="M872 -30 C 932 208, 800 412, 962 690 S 1062 972, 1002 1070" stroke-width="7"/>
      <path d="M150 1045 C 342 800, 706 882, 985 600 S 1330 360, 1700 432" stroke-width="7"/>
    </g>
    <g stroke="#c79a3a" stroke-opacity="0.88">
      <path d="M-30 300 C 240 248, 432 402, 690 338 S 1120 228, 1700 338" stroke-width="3.2"/>
      <path d="M432 402 C 474 472, 562 504, 604 606" stroke-width="2"/>
      <path d="M690 338 C 742 298, 772 360, 842 330" stroke-width="1.6"/>
      <path d="M872 -30 C 932 208, 800 412, 962 690 S 1062 972, 1002 1070" stroke-width="3.2"/>
      <path d="M962 690 C 1022 720, 1064 690, 1146 742" stroke-width="2"/>
      <path d="M800 412 C 742 430, 700 392, 636 410" stroke-width="1.5"/>
      <path d="M150 1045 C 342 800, 706 882, 985 600 S 1330 360, 1700 432" stroke-width="2.8"/>
      <path d="M706 880 C 766 905, 806 962, 886 960" stroke-width="1.6"/>
      <path d="M1330 360 C 1372 320, 1432 342, 1486 300" stroke-width="1.6"/>
      <path d="M985 600 C 1010 540, 1080 520, 1110 452" stroke-width="1.5"/>
    </g>
    <g stroke="#f0d68a" stroke-opacity="0.75">
      <path d="M-30 300 C 240 248, 432 402, 690 338 S 1120 228, 1700 338" stroke-width="1"/>
      <path d="M872 -30 C 932 208, 800 412, 962 690 S 1062 972, 1002 1070" stroke-width="0.9"/>
      <path d="M150 1045 C 342 800, 706 882, 985 600 S 1330 360, 1700 432" stroke-width="0.9"/>
    </g>
