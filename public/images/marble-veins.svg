    <path d="M1300 -40 C 1360 200, 1240 410, 1380 670 S 1460 950, 1400 1140" stroke-width="2.6" stroke-opacity="0.36"/>
    <!-- branches -->
    <path d="M430 392 C 478 470, 560 506, 604 612" stroke-width="1.6" stroke-opacity="0.30"/>
    <path d="M700 320 C 752 280, 786 346, 858 314" stroke-width="1.4" stroke-opacity="0.28"/>
    <path d="M820 540 C 868 590, 940 596, 1000 668" stroke-width="1.4" stroke-opacity="0.26"/>
