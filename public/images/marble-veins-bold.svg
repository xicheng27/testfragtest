    <path d="M430 345 C 478 422, 560 458, 604 560" stroke-width="6" stroke-opacity="0.32"/>
    <path d="M820 560 C 868 610, 940 616, 1000 688" stroke-width="6" stroke-opacity="0.30"/>
    <path d="M392 780 C 462 806, 502 870, 588 878" stroke-width="5.5" stroke-opacity="0.30"/>
    <path d="M1210 720 C 1270 740, 1322 706, 1404 752" stroke-width="5.5" stroke-opacity="0.30"/>
    <path d="M700 268 C 752 230, 786 296, 858 264" stroke-width="5" stroke-opacity="0.28"/>
  </g>

  <!-- Gold kintsugi veins: thick, bold, with glow + highlight -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#soft)" stroke="#e7c878" stroke-opacity="0.5">
      <path d="M-30 300 C 240 248, 432 402, 690 338 S 1120 228, 1700 338" stroke-width="30"/>
      <path d="M872 -30 C 932 208, 800 412, 962 690 S 1062 972, 1002 1070" stroke-width="28"/>
