<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="cloud" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f6f5f1"/>

  <!-- Soft grey marble clouds -->
  <g filter="url(#cloud)" fill="none" stroke-linecap="round" stroke="#a9a299">
    <path d="M-60 220 C 260 140, 470 360, 760 250 S 1220 140, 1700 300" stroke-width="44" stroke-opacity="0.24"/>
    <path d="M-60 720 C 320 600, 620 800, 920 670 S 1320 540, 1700 700" stroke-width="48" stroke-opacity="0.22"/>
    <path d="M330 -60 C 390 250, 250 520, 440 800 S 540 1070, 470 1160" stroke-width="40" stroke-opacity="0.20"/>
    <path d="M1180 -60 C 1240 200, 1120 430, 1280 710 S 1360 990, 1300 1130" stroke-width="38" stroke-opacity="0.18"/>
  </g>

  <!-- Black / charcoal veins: thick and bold -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#1f1b16">
    <path d="M-40 220 C 240 175, 430 345, 700 268 S 1180 150, 1700 270" stroke-width="12" stroke-opacity="0.42"/>
    <path d="M-40 560 C 280 520, 520 668, 820 560 S 1280 452, 1700 580" stroke-width="11" stroke-opacity="0.40"/>
