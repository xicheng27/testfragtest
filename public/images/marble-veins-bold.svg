      <path d="M962 690 C 1022 720, 1064 690, 1146 742" stroke-width="8"/>
      <path d="M480 730 C 520 786, 480 842, 530 908" stroke-width="7"/>
      <path d="M985 600 C 1010 540, 1085 520, 1118 452" stroke-width="7"/>
      <path d="M706 882 C 766 907, 806 964, 886 962" stroke-width="7"/>
      <path d="M1365 650 C 1423 666, 1475 630, 1561 670" stroke-width="6.5"/>
      <path d="M690 338 C 742 298, 772 360, 842 330" stroke-width="6"/>
    </g>
    <g stroke="#f6df9c" stroke-opacity="0.85">
      <path d="M-30 300 C 240 248, 432 402, 690 338 S 1120 228, 1700 338" stroke-width="4"/>
      <path d="M872 -30 C 932 208, 800 412, 962 690 S 1062 972, 1002 1070" stroke-width="4"/>
      <path d="M150 1045 C 342 800, 706 882, 985 600 S 1330 360, 1700 432" stroke-width="3.5"/>
