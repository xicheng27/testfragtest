      <path d="M-30 660 C 270 612, 480 730, 770 640 S 1190 548, 1700 660" stroke-width="24"/>
      <path d="M1300 -30 C 1355 200, 1235 390, 1365 650 S 1440 920, 1390 1100" stroke-width="24"/>
    </g>
    <g stroke="#c39633" stroke-opacity="0.95">
      <path d="M-30 300 C 240 248, 432 402, 690 338 S 1120 228, 1700 338" stroke-width="15"/>
      <path d="M872 -30 C 932 208, 800 412, 962 690 S 1062 972, 1002 1070" stroke-width="15"/>
      <path d="M150 1045 C 342 800, 706 882, 985 600 S 1330 360, 1700 432" stroke-width="14"/>
